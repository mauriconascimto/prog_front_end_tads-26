<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e1014">
    <meta name="description" content="Página inicial com links para os projetos de programação front-end.">
    <title>Projetos | Front-end TADS</title>
    <style>
        @font-face {
            font-family: "Poppins";
            src: url("tecboard/font/Poppins-Bold.ttf") format("truetype");
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: "Roboto";
            src: url("tecboard/font/Roboto-Bold.ttf") format("truetype");
            font-weight: 700;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            font-family: "Roboto", Arial, sans-serif;
            background: #0e1014;
            color: #fff;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgb(151 71 255 / 16%), transparent 48rem),
                #0e1014;
        }

        main {
            width: min(100% - 40px, 960px);
            margin: 0 auto;
            padding: clamp(64px, 12vh, 120px) 0 48px;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #c9a5ff;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-align: center;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: "Poppins", "Arial Black", sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            line-height: 1.05;
            text-align: center;
        }

        h1 span {
            color: #9747ff;
        }

        .intro {
            max-width: 600px;
            margin: 20px auto 52px;
            color: #c2c3c9;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.7;
            text-align: center;
        }

        h2 {
            margin: 0 0 18px;
            font-size: 1rem;
            letter-spacing: 0.04em;
        }

        .project-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
            gap: 16px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .project-link {
            display: flex;
            min-height: 112px;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 24px;
            border: 1px solid #30313a;
            border-radius: 16px;
            background: rgb(255 255 255 / 4%);
            color: inherit;
            text-decoration: none;
            transition: border-color 180ms ease, background-color 180ms ease, transform 180ms ease;
        }

        .project-link:hover {
            transform: translateY(-3px);
            border-color: #9747ff;
            background: rgb(151 71 255 / 10%);
        }

        .project-link:focus-visible {
            outline: 3px solid #c9a5ff;
            outline-offset: 4px;
        }

        .project-name {
            display: block;
            margin-bottom: 7px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .project-description {
            color: #b7b8c0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .arrow {
            flex: 0 0 auto;
            color: #c9a5ff;
            font-size: 1.5rem;
        }

        footer {
            margin-top: 40px;
            color: #858690;
            font-size: 0.85rem;
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Programação Front-end · TADS</p>
        <h1>Projetos <span>em destaque</span></h1>
        <p class="intro">Explore os projetos desenvolvidos. Novos trabalhos podem ser adicionados a esta lista conforme as pastas forem criadas.</p>

        <section aria-labelledby="projects-title">
            <h2 id="projects-title">Projetos disponíveis</h2>
            <ul class="project-list">
                <li>
                    <a class="project-link" href="tecboard/index.html">
                        <span>
                            <span class="project-name">Tecboard</span>
                            <span class="project-description">Tendências e conteúdos do mercado de tecnologia.</span>
                        </span>
                        <span class="arrow" aria-hidden="true">↗</span>
                    </a>
                </li>
                <!-- Para incluir um novo projeto, adicione outro item:
                <li>
                    <a class="project-link" href="nome-da-pasta/index.html">
                        <span>
                            <span class="project-name">Nome do projeto</span>
                            <span class="project-description">Uma breve descrição do projeto.</span>
                        </span>
                        <span class="arrow" aria-hidden="true">↗</span>
                    </a>
                </li>
                -->
            </ul>
        </section>

        <footer>Repositório de projetos · Front-end TADS</footer>
    </main>
</body>
</html>
